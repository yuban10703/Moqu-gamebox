# 把本仓库的**纯代码**单向同步到公开仓库（文档 / 截图 / README 一律不过去）。
#
# 同步逻辑在 `tools/scripts/sync-public.sh`（可本地直接跑，便于验证），这个工作流只负责
# 触发、检查配置、把带 token 的目标地址交给脚本。按用户要求：
#   · **不用 force-push**：只做追加式推送（非快进就报错，不覆盖公开仓库）；
#   · **首次不搬历史**：公开仓库的第一条提交是当前代码的"初始快照"；
#   · **之后按标题同步**：私有仓库每多一个提交，就在公开仓库追加一个**同名标题**的提交
#     （只取标题，不带正文与作者信息）；只改文档的提交会被跳过，不留空提交。
#
# ── 一次性配置（都在**私有**仓库的 Settings 里做）──────────────────────────────
#   1) Secrets and variables → Actions → **Secrets** → New repository secret
#        Name : PUBLIC_REPO_TOKEN
#        Value: 对公开仓库有 `Contents: Read and write` 的 token（细粒度 PAT 只授权目标仓库即可）
#   2) Secrets and variables → Actions → **Variables** → New repository variable
#        Name : PUBLIC_REPO
#        Value: <owner>/<公开仓库名>     例如 yuban10703/eink-gamebox-public
#   3) 公开仓库可以是空仓库，也可以已有内容（已有提交不会被覆盖，新提交追加在后面）。
#
# ── 怎么跑 ──────────────────────────────────────────────────────────────────
#   推 main 自动触发（纯文档提交被 paths-ignore 跳过）；也可以在 Actions 页手动 Run workflow
#   （手动跑同样能续传：脚本从公开仓库最后一条提交的 `Private-Rev:` 里读回进度）。

name: sync-public

on:
  push:
    branches: [main]
    # 纯文档提交不改变快照内容，没必要跑
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/workflows/sync-public.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-public
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检查必需的配置
        env:
          TARGET: ${{ vars.PUBLIC_REPO }}
          TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          missing=0
          if [ -z "$TARGET" ]; then
            echo "::error::缺少仓库变量 PUBLIC_REPO（Settings → Secrets and variables → Actions → Variables，值形如 owner/repo）"
            missing=1
          fi
          if [ -z "$TOKEN" ]; then
            echo "::error::缺少仓库密钥 PUBLIC_REPO_TOKEN（对公开仓库有 Contents: Read and write 的 token）"
            missing=1
          fi
          [ "$missing" = 0 ] || exit 1
          echo "目标公开仓库：$TARGET"

      - uses: actions/checkout@v4
        with:
          # 要按提交逐个重放，必须拿全历史
          fetch-depth: 0

      - name: 同步纯代码到公开仓库
        env:
          TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
          TARGET: ${{ vars.PUBLIC_REPO }}
        run: bash tools/scripts/sync-public.sh "https://x-access-token:${TOKEN}@github.com/${TARGET}.git"
