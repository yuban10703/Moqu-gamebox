name: 打包 APK 并发布 Release

# 发布规则：**只有版本号变了才发布**。
# 判断方式不是看"这次提交改了什么"，而是看 `v<versionName>` 这个 tag/release 是否已经存在 ——
# 版本号没变 → tag 已存在 → 整个构建与发布流程直接跳过（不会重复发、也不会白烧构建时间）。
# 改版本号（apps/android/app/build.gradle.kts 的 versionName / versionCode，package.json 同步）即触发。
on:
  push:
    branches: [main]
  workflow_dispatch: # 也允许手动跑一次（重试失败、补发布）

permissions:
  contents: write # 创建 Release 需要

concurrency:
  group: release-apk
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 取代码（连同全部 tag，用来判断版本是否已发布）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 读取版本号并校验两处一致
        id: v
        run: |
          set -euo pipefail
          GRADLE_FILE=apps/android/app/build.gradle.kts
          NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' "$GRADLE_FILE" | head -1)
          CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' "$GRADLE_FILE" | head -1)
          if [ -z "$NAME" ] || [ -z "$CODE" ]; then
            echo "::error::没能从 $GRADLE_FILE 读到 versionName / versionCode"
            exit 1
          fi
          # package.json 的 version 必须与 versionName 一致，避免"改了一个忘另一个"
          PKG=$(node -p "require('./package.json').version")
          if [ "$PKG" != "$NAME" ]; then
            echo "::error::package.json 是 $PKG，build.gradle.kts 是 $NAME —— 请改成一致再发布"
            exit 1
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "版本 v$NAME（versionCode $CODE）"

      - name: 判断这个版本是否已经发布过
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v${{ steps.v.outputs.name }}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null || gh release view "$TAG" >/dev/null 2>&1; then
            echo "publish=no" >> "$GITHUB_OUTPUT"
            echo "::notice::$TAG 已存在 —— 版本号没变，跳过构建与发布"
          else
            echo "publish=yes" >> "$GITHUB_OUTPUT"
            echo "::notice::$TAG 尚未发布，开始构建"
          fi

      - name: 装 Node（Gradle 的 syncWebAssets 会调 npm run build:web）
        if: steps.gate.outputs.publish == 'yes'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 安装依赖
        if: steps.gate.outputs.publish == 'yes'
        run: npm ci

      - name: 发布前跑全门禁（类型检查 + 单测 + i18n + 构建 + 文档/接入核对）
        if: steps.gate.outputs.publish == 'yes'
        run: npm run check

      - name: 装 JDK 17（与 tools/scripts/setup-android-toolchain.sh 一致）
        if: steps.gate.outputs.publish == 'yes'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 不用 android-actions/setup-android：它会去装早已从 SDK 仓库移除的 legacy `tools` 包，
      # 直接报 `Warning: Failed to find package 'tools'` 并让整个 job 失败（2026-10-05 踩到）。
      # ubuntu-latest 镜像本来就预装 Android SDK 与 cmdline-tools（/usr/local/lib/android/sdk），
      # 这里只补项目要用的组件，包名与 tools/scripts/setup-android-toolchain.sh 的清单一致。
      - name: 装 Android SDK 组件
        if: steps.gate.outputs.publish == 'yes'
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK" || { echo "::error::找不到 Android SDK：$SDK"; exit 1; }
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "SDK: $SDK"
          # sdkmanager 的位置各镜像不同：PATH 上 / cmdline-tools/latest/bin / cmdline-tools/<版本>/bin
          if command -v sdkmanager > /dev/null; then
            SDKMANAGER="$(command -v sdkmanager)"
          elif [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(find "$SDK/cmdline-tools" -maxdepth 4 -name sdkmanager -type f | sort | tail -1)"
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER" \
            || { echo "::error::找不到可执行的 sdkmanager（SDK=$SDK）"; ls -R "$SDK/cmdline-tools" | head -20; exit 1; }
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          ls "$SDK/platforms" "$SDK/build-tools" | sed 's/^/  已装: /'

      - name: 装 Gradle 8.14.3（本仓库没有 gradle wrapper）
        if: steps.gate.outputs.publish == 'yes'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: 准备正式签名（可选：四个 Secrets 缺任一就回退 debug 签名）
        if: steps.gate.outputs.publish == 'yes'
        id: signing
        env:
          JKS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          JKS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # 从网页粘贴进 Secrets 的值常常带上换行/回车（GitHub 的输入框会原样保存），
          # keytool / gradle 会拿着 "密码\n" 去解，报一个看不出原因的
          # "keystore password was incorrect" —— 2026-10-05 首次正式签名发布就是这么红的。
          # 这里统一剥掉换行与回车；**不动空格**，免得把含空格的口令改坏。
          trim() { printf '%s' "$1" | tr -d '\n\r'; }
          JKS_B64="$(trim "${JKS_B64:-}")"
          JKS_PASS="$(trim "${JKS_PASS:-}")"
          KEY_ALIAS="$(trim "${KEY_ALIAS:-}")"
          KEY_PASS="$(trim "${KEY_PASS:-}")"
          if [ -z "$JKS_B64" ] || [ -z "$JKS_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "keystore=no" >> "$GITHUB_OUTPUT"
            echo "::warning::没配齐 ANDROID_KEYSTORE_BASE64 / _PASSWORD / KEY_ALIAS / KEY_PASSWORD —— 本次用 debug 签名，包与包之间签名不同，换版本要先卸载"
            exit 0
          fi
          # 只打印长度与指纹，绝不打印内容 —— 出错时这两行就能定位是"粘歪了"还是"密码不对"
          echo "Secrets 长度：base64=${#JKS_B64}（keystore 2708 字节 → 3612）密码=${#JKS_PASS} 别名=${#KEY_ALIAS}"
          JKS="$RUNNER_TEMP/moqu-release.jks"
          if ! printf '%s' "$JKS_B64" | base64 -d > "$JKS" 2>/dev/null; then
            echo "::error::ANDROID_KEYSTORE_BASE64 不是合法 base64（长度 ${#JKS_B64}，应为 3612）—— 重新粘贴 .jks.b64 的全部内容"
            exit 1
          fi
          SIZE=$(wc -c < "$JKS")
          echo "解出的 keystore：$SIZE 字节（应为 2708）"
          if [ "$SIZE" -lt 1000 ]; then
            echo "::error::解出来的 keystore 太小（$SIZE 字节），看起来 base64 被截断了"
            exit 1
          fi
          if ! keytool -list -keystore "$JKS" -storepass "$JKS_PASS" > "$RUNNER_TEMP/keytool.txt" 2>&1; then
            echo "::error::keystore 打不开 —— 多半是 ANDROID_KEYSTORE_PASSWORD 与生成密钥时不一致"
            cat "$RUNNER_TEMP/keytool.txt"
            exit 1
          fi
          {
            echo "EINK_KEYSTORE_FILE=$JKS"
            echo "EINK_KEYSTORE_PASSWORD=$JKS_PASS"
            echo "EINK_KEY_ALIAS=$KEY_ALIAS"
            echo "EINK_KEY_PASSWORD=$KEY_PASS"
          } >> "$GITHUB_ENV"
          echo "keystore=yes" >> "$GITHUB_OUTPUT"
          echo "签名证书（指纹应与你本地 keytool -list -v 一致）："
          grep -E "Alias name|Certificate fingerprint" "$RUNNER_TEMP/keytool.txt" || tail -4 "$RUNNER_TEMP/keytool.txt"

      - name: 构建 APK（有正式签名则 release 签名，否则 debug；产物都可直接侧载）
        if: steps.gate.outputs.publish == 'yes'
        working-directory: apps/android
        run: gradle --no-daemon assembleRelease

      - name: 整理产物并算校验和
        if: steps.gate.outputs.publish == 'yes'
        id: apk
        run: |
          set -euo pipefail
          # assembleRelease 在有 signingConfig 时产出 app-release.apk（未配置签名才是 -unsigned）
          SRC=apps/android/app/build/outputs/apk/release/app-release.apk
          test -f "$SRC" || { echo "::error::没找到 $SRC"; ls -R apps/android/app/build/outputs/apk || true; exit 1; }
          # 把签名者打出来存档（配了正式签名时能一眼确认不是 Debug）
          keytool -printcert -jarfile "$SRC" | grep -E "^Owner:|^Valid from" | sed 's/^/  签名: /'
          NAME="moqu-${{ steps.v.outputs.name }}.apk"
          cp "$SRC" "$NAME"
          SHA=$(sha256sum "$NAME" | cut -d' ' -f1)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          ls -lh "$NAME"
          echo "SHA-256: $SHA"

      - name: 写 Release 说明（签名方式不同，提示也不同）
        if: steps.gate.outputs.publish == 'yes'
        env:
          VERSION: ${{ steps.v.outputs.name }}
          CODE: ${{ steps.v.outputs.code }}
          SHA: ${{ steps.apk.outputs.sha }}
          SIGNED: ${{ steps.signing.outputs.keystore }}
        run: |
          set -euo pipefail
          # 注意：这里用**不带引号**的 heredoc（要让 $VERSION/$CODE/$SHA 展开），
          # 因此正文里的反引号必须转义成 \`，否则会被当成命令替换执行。
          cat > release-notes.md <<EOF
          **墨趣** —— 为墨水屏而生的离线游戏合集，17 款游戏，中文 / 英文，完全离线、不申请任何权限。

          EOF
          if [ -f "docs/releases/v$VERSION.md" ]; then
            cat "docs/releases/v$VERSION.md" >> release-notes.md
          fi
          cat >> release-notes.md <<EOF

          ## 下载安装

          - **手机 / 平板**：下载下面的 \`moqu-$VERSION.apk\`，点开安装（需允许「安装未知来源的应用」）。
          - **墨水屏阅读器（BOOX 等）**：把 APK 传到设备上点开安装即可，Android 6.0 以上都行。
          - **不想装应用**：用浏览器打开 <https://moqu.2333.world/>，在阅读器上选「添加到主屏幕」后断网也能玩。

          ## 说明

          - 自用分发，与任何应用商店无关。
          - 包名 \`com.einkgamebox\`，\`versionCode $CODE\`，SHA-256 \`$SHA\`。
          EOF
          if [ "$SIGNED" = "yes" ]; then
            cat >> release-notes.md <<EOF

          - 本次为**正式 keystore 签名**：若你装的是更早的 debug 签名版本（v0.1.0），
            需要先卸载一次；这之后各版本之间都能直接覆盖升级。
          EOF
          else
            cat >> release-notes.md <<EOF

          - ⚠️ 本次是 **debug 签名**（Secrets 没配齐）：调试密钥由构建机现场生成，每个包的签名都不同，
            **换版本要先卸载旧版再装**。配好固定 keystore 后即可正常覆盖升级，见 docs/android.md 的「发布」一节。
          EOF
          fi

      - name: 发布 Release
        if: steps.gate.outputs.publish == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.v.outputs.name }}
        run: |
          set -euo pipefail
          gh release create "v$VERSION" "moqu-$VERSION.apk" \
            --title "墨趣 v$VERSION" \
            --target "$GITHUB_SHA" \
            --notes-file release-notes.md
