<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>墨趣 · 设备自检</title>
    <!--
      这一页**故意不依赖任何外部文件**（无 CSS、无脚本引入）：
      它的用途恰恰是"主应用跑不起来时，看清这台设备到底缺什么"，
      因此不能共用任何可能出问题的那部分代码。全部内联、全部 ES5。
    -->
  </head>
  <body style="margin:0;padding:14px;background:#fff;color:#000;font-size:15px;line-height:1.6;">
    <h1 style="font-size:19px;margin:0 0 6px;">墨趣 · 设备自检</h1>
    <p style="margin:0 0 12px;font-size:13px;">
      把这一页的结果拍照，就能判断这台 Kindle 能不能跑墨趣。下方每一项：★ = 支持，☆ = 不支持。
    </p>

    <div id="out" style="font-size:14px;">检测中……</div>

    <h2 style="font-size:16px;margin:16px 0 6px;">自检报告</h2>
    <p style="margin:0 0 6px;font-size:12px;">下面的文本可以长按选中（Kindle 上用于反馈排障）</p>
    <textarea id="report" readonly style="width:100%;height:150px;font-size:11px;box-sizing:border-box;border:1px solid #000;"></textarea>

    <p style="margin:14px 0 0;font-size:13px;">
      <a href="./index.html" style="color:#000;">← 返回墨趣</a>
    </p>

    <script>
      (function () {
        'use strict';

        var lines = [];
        var report = [];

        function add(key, ok, detail) {
          var el = document.createElement('div');
          el.style.cssText = 'padding:2px 0;';
          var mark = document.createElement('span');
          mark.style.fontWeight = '700';
          mark.textContent = (ok ? '\u2605 ' : '\u2606 ') + key;
          el.appendChild(mark);
          if (detail) {
            var small = document.createElement('span');
            small.style.cssText = 'font-size:11px;';
            small.textContent = ' \u2014 ' + detail;
            el.appendChild(small);
          }
          lines.push(el);
          report.push(key + '=' + (ok ? '1' : '0'));
        }

        function probe(key, fn) {
          var ok = false;
          var detail = '';
          try {
            var value = fn();
            if (value === false || value === undefined || value === null) {
              ok = false;
            } else {
              ok = true;
              detail = value === true ? '' : String(value);
            }
          } catch (e) {
            ok = false;
            detail = 'err: ' + e;
          }
          add(key, ok, detail);
        }

        // ---------- 基本环境 ----------
        probe('userAgent', function () { return navigator.userAgent || '?'; });
        probe('viewport', function () { return window.innerWidth + '\u00D7' + window.innerHeight; });
        probe('devicePixelRatio', function () { return String(window.devicePixelRatio || 1); });
        probe('platform', function () { return navigator.platform || '?'; });

        // ---------- 主应用真正依赖的能力 ----------
        probe('querySelector', function () { return !!document.querySelector; });
        probe('addEventListener', function () { return !!window.addEventListener; });
        probe('createElementNS(SVG)', function () {
          var node = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
          return !!node && typeof node.setAttribute === 'function';
        });
        probe('JSON', function () { return !!window.JSON && typeof JSON.parse === 'function'; });
        probe('localStorage', function () {
          var key = '__moqu_probe__';
          window.localStorage.setItem(key, '1');
          var value = window.localStorage.getItem(key);
          window.localStorage.removeItem(key);
          return value === '1' ? 'read/write ok' : false;
        });
        probe('XMLHttpRequest', function () { return !!window.XMLHttpRequest; });
        probe('XHR onload/responseType', function () {
          var xhr = new window.XMLHttpRequest();
          return 'onload' in xhr && 'responseType' in xhr;
        });
        probe('Promise(原生)', function () { return typeof Promise !== 'undefined'; });
        probe('Set/Map(原生)', function () { return typeof Set !== 'undefined' && typeof Map !== 'undefined'; });
        probe('Symbol(原生)', function () { return typeof Symbol !== 'undefined'; });

        // ---------- ES5 语法与常用方法（缺了主应用会直接抛错） ----------
        probe('ES5 strict mode', function () { return true; });
        probe('Array.prototype.forEach/indexOf/map', function () {
          return typeof [].forEach === 'function' && typeof [].indexOf === 'function' && typeof [].map === 'function';
        });
        probe('Object.keys', function () { return typeof Object.keys === 'function'; });
        probe('Object.defineProperty', function () { return typeof Object.defineProperty === 'function'; });
        probe('JSON.stringify', function () { return typeof JSON.stringify === 'function'; });
        probe('Array.isArray', function () { return typeof Array.isArray === 'function'; });
        probe('Function.prototype.bind', function () { return typeof Function.prototype.bind === 'function'; });
        probe('String.prototype.trim', function () { return typeof ''.trim === 'function'; });
        probe('Date.now', function () { return typeof Date.now === 'function'; });

        // ---------- 主应用会**自己补**的（缺了也没关系，用于确认补丁是否生效） ----------
        probe('[已补] Array.prototype.includes', function () { return typeof [].includes === 'function'; });
        probe('[已补] Array.prototype.at', function () { return typeof [].at === 'function'; });
        probe('[已补] Object.entries', function () { return typeof Object.entries === 'function'; });
        probe('[已补] String.prototype.padStart', function () { return typeof ''.padStart === 'function'; });
        probe('[已补] Array.prototype[Symbol.iterator]', function () {
          return typeof Symbol !== 'undefined' && typeof [][Symbol.iterator] === 'function';
        });

        // ---------- 样式能力（决定界面的降级档次） ----------
        probe('CSS border-radius', function () {
          var node = document.createElement('div');
          node.style.cssText = 'border-radius:4px;';
          return node.style.borderRadius !== '' || node.style.getPropertyValue('border-radius') !== '';
        });
        probe('CSS box-shadow(含 inset)', function () {
          var node = document.createElement('div');
          node.style.cssText = 'box-shadow:inset 0 0 0 2px #000;';
          return node.style.boxShadow !== '' || node.style.getPropertyValue('box-shadow') !== '';
        });
        probe('CSS repeating-linear-gradient', function () {
          var node = document.createElement('div');
          node.style.cssText = 'background-image:repeating-linear-gradient(45deg,#eee,#eee 3px,#ddd 3px,#ddd 6px);';
          return node.style.backgroundImage !== '' && node.style.backgroundImage.indexOf('gradient') >= 0;
        });
        probe('CSS 变量 (--x)', function () {
          var node = document.createElement('div');
          node.style.setProperty('--probe', '1', '');
          return node.style.getPropertyValue('--probe') === '1';
        });
        probe('CSS display:grid', function () {
          var node = document.createElement('div');
          node.style.cssText = 'display:grid;';
          return node.style.display === 'grid';
        });
        probe('CSS display:table-cell', function () {
          var node = document.createElement('div');
          node.style.cssText = 'display:table-cell;';
          return node.style.display === 'table-cell';
        });

        // ---------- 交互 ----------
        probe('touch 事件', function () {
          return ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
        });
        probe('keydown 事件', function () { return 'onkeydown' in window; });
        probe('history.pushState', function () { return !!(window.history && window.history.pushState); });

        // ---------- 渲染耗时实测（老 CPU 上最关键的指标） ----------
        var started = new Date().getTime();
        var host = document.createElement('div');
        host.style.cssText = 'position:absolute;left:-9999px;top:0;';
        document.body.appendChild(host);
        var table = document.createElement('table');
        table.setAttribute('cellspacing', '0');
        table.setAttribute('cellpadding', '0');
        for (var r = 0; r < 9; r++) {
          var tr = document.createElement('tr');
          for (var c = 0; c < 9; c++) {
            var td = document.createElement('td');
            td.style.cssText = 'width:34px;height:34px;border:1px solid #000;text-align:center;font-size:20px;';
            td.textContent = String((r * 9 + c) % 10);
            tr.appendChild(td);
          }
          table.appendChild(tr);
        }
        host.appendChild(table);
        var built = new Date().getTime() - started;
        document.body.removeChild(host);
        probe('81 格棋盘构建耗时', function () { return built + ' ms'; });
        report.push('grid81_ms=' + built);

        // ---------- 输出 ----------
        var out = document.getElementById('out');
        out.innerHTML = '';
        for (var i = 0; i < lines.length; i++) {
          out.appendChild(lines[i]);
        }

        report.unshift('moqu-kindle-check');
        report.unshift('ua=' + (navigator.userAgent || '?'));
        report.unshift('viewport=' + window.innerWidth + 'x' + window.innerHeight);
        document.getElementById('report').value = report.join('\n');
      })();
    </script>
  </body>
</html>
